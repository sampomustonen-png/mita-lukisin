name: Päivitä aineisto
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl xlrd
      - run: bash scripts/update.sh
      - name: Tallenna muuttunut aineisto
        run: |
          if git diff --quiet data/books.json data/msl.json; then echo "Ei muutoksia"; exit 0; fi
          git config user.name "mita-lukisin-bot"
          git config user.email "mita-lukisin-bot@users.noreply.github.com"
          git add data/books.json data/msl.json
          git commit -m "Aineiston päivitys $(date -u +%Y-%m-%d)"
          git push
